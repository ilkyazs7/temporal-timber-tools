*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0c;--bg2:#161614;--bg3:#1e1e1c;
  --border:#252523;--border2:#353533;
  --text:#d4d4c8;--text2:#888878;--text3:#444438;
  --accent:#c8f060;--accent2:#60c8f0;
  --ok:#60d090;--warn:#f0b040;--danger:#f06050;
  --font:'SpotMono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:12px}
#app{display:flex;flex-direction:column;height:100vh;position:relative}

/* TOP */
#top{height:42px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px;flex-shrink:0}
.tlabel{font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.yr{font-size:17px;font-weight:500;color:var(--accent);min-width:42px;text-align:center}
#yr-slider{width:180px;accent-color:var(--accent)}
.sep{width:1px;height:16px;background:var(--border)}
.mbtn{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;border-radius:2px;font-family:var(--font);transition:all .12s}
.mbtn:hover{color:var(--text)}
.mbtn.on-life{border-color:var(--accent);color:var(--accent);background:rgba(200,240,96,.06)}
.mbtn.on-moist{border-color:var(--accent2);color:var(--accent2);background:rgba(96,200,240,.06)}
.spacer{flex:1}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden}
#viewport{flex:1;position:relative;overflow:hidden}
#three-canvas{display:block;width:100%;height:100%}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);letter-spacing:.06em;pointer-events:none;white-space:nowrap}

/* LEFT */
#left{width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#lhead{padding:12px 14px;border-bottom:1px solid var(--border)}
.lh-tag{font-size:8px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.lh-id{font-size:13px;color:var(--accent);font-weight:500}
.lh-sub{font-size:9px;color:var(--text2);margin-top:1px}
#lbody{flex:1;overflow-y:auto}
.empty{padding:28px 14px;text-align:center;font-size:10px;color:var(--text3);line-height:2.4}
.sec{padding:10px 14px;border-bottom:1px solid var(--border)}
.sec-tag{font-size:8px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:4px;align-items:baseline}
.bar-label span{font-size:9px;color:var(--text2)}
.bar-label .val{font-size:13px;font-weight:500}
.bar-bg{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .5s}
.irow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.ik{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.iv{font-size:10px;color:var(--text);text-align:right;max-width:140px}
#sub-btn{margin:10px 14px;font-family:var(--font);font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;border-radius:2px;transition:all .15s;width:calc(100% - 28px)}
#sub-btn:hover{border-color:var(--accent);color:var(--accent)}
#sub-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(200,240,96,.05)}
#sub-btn:disabled{opacity:.3;cursor:not-allowed;border-color:var(--border)}

/* RIGHT INVENTORY */
#right{width:256px;border-left:1px solid var(--border);display:none;flex-direction:column;flex-shrink:0}
#right.open{display:flex}
#rhead{padding:12px 14px;border-bottom:1px solid var(--border)}
.rh-tag{font-size:8px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.rh-sub{font-size:10px;color:var(--text2)}
#inv-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}

/* INVENTORY CARD */
.icard{border:1px solid var(--border);border-radius:4px;padding:10px 12px;cursor:pointer;transition:all .15s;background:var(--bg);position:relative}
.icard:hover{border-color:var(--border2);background:var(--bg3)}
.icard.compatible{border-color:rgba(96,208,144,.35);background:rgba(96,208,144,.04)}
.icard.compatible:hover{border-color:var(--ok)}
.icard.incompatible{opacity:.45;cursor:not-allowed}
.icard.incompatible:hover{border-color:var(--border)}
.icard-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.icard-icon{width:32px;height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:500;letter-spacing:.03em}
.icard-icon.new{background:rgba(96,208,144,.15);color:var(--ok);border:1px solid rgba(96,208,144,.3)}
.icard-icon.reclaimed{background:rgba(240,176,64,.12);color:var(--warn);border:1px solid rgba(240,176,64,.25)}
.icard-info{flex:1;min-width:0}
.icard-id{font-size:11px;color:var(--accent);font-weight:500}
.icard-grade{font-size:10px;color:var(--text2);margin-top:1px}
.icard-species{font-size:9px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard-bars{display:flex;flex-direction:column;gap:3px}
.mb{height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.mb-fill{height:100%;border-radius:1px}
.icard-foot{display:flex;justify-content:space-between;margin-top:6px;align-items:center}
.icard-foot span{font-size:9px}
.compat-badge{position:absolute;top:8px;right:9px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.compat-badge.ok{background:rgba(96,208,144,.15);color:var(--ok)}
.compat-badge.no{background:rgba(240,96,80,.1);color:var(--danger)}
.compat-reason{font-size:8px;color:var(--text3);margin-top:5px;line-height:1.5;font-style:italic}
.compat-reason.ok-reason{color:rgba(96,208,144,.7)}
.compat-reason.no-reason{color:rgba(240,96,80,.6)}

/* CONFIRM MODAL */

/* STATUS */
#status{height:26px;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0}
.st{font-size:9px;color:var(--text3);display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%}

/* TOOLTIP */
#tip{position:fixed;pointer-events:none;background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:6px 10px;font-size:10px;line-height:1.7;display:none;z-index:50;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="tlabel">Year</span>
    <span class="yr" id="yr-disp">2024</span>
    <input type="range" id="yr-slider" min="0" max="60" step="1" value="0">
    <span class="tlabel" style="color:var(--text3)">+60</span>
    <div class="sep"></div>
    <button class="mbtn on-life" id="btn-life" onclick="toggleMode('life')">Lifetime</button>
    <button class="mbtn" id="btn-moist" onclick="toggleMode('moist')">Moisture</button>
    <div class="spacer"></div>
    <span class="tlabel">28 walls · Floor 0</span>
  </div>

  <div id="main">
    <!-- LEFT PASSPORT -->
    <div id="left">
      <div id="lhead">
        <div class="lh-tag">Element</div>
        <div class="lh-id" id="lh-id">—</div>
        <div class="lh-sub" id="lh-sub"></div>
      </div>
      <div id="lbody">
        <div class="empty" id="empty-msg">click a wall<br>to inspect</div>
        <div id="detail" style="display:none">
          <div class="sec">
            <div class="sec-tag">Lifetime</div>
            <div class="bar-row">
              <div class="bar-label"><span>Remaining</span><span class="val" id="b-life-val">—</span></div>
              <div class="bar-bg"><div class="bar-fill" id="b-life" style="width:0%"></div></div>
            </div>
          </div>
          <div class="sec">
            <div class="sec-tag">Moisture exposure</div>
            <div class="bar-row">
              <div class="bar-label"><span>Index</span><span class="val" id="b-moist-val" style="color:var(--accent2)">—</span></div>
              <div class="bar-bg"><div class="bar-fill" id="b-moist" style="width:0%;background:var(--accent2);opacity:.7"></div></div>
            </div>
          </div>
          <div class="sec">
            <div class="irow"><span class="ik">Grade</span><span class="iv" id="d-grade">—</span></div>
            <div class="irow"><span class="ik">Species</span><span class="iv" id="d-species">—</span></div>
            <div class="irow"><span class="ik">Installed</span><span class="iv" id="d-install">—</span></div>
            <div class="irow"><span class="ik">Lifespan</span><span class="iv" id="d-life">—</span></div>
            <div class="irow"><span class="ik">Zone</span><span class="iv" id="d-zone">—</span></div>
            <div class="irow"><span class="ik">Dist. ctr</span><span class="iv" id="d-dist">—</span></div>
            <div class="irow"><span class="ik">Risk</span><span class="iv" id="d-risk" style="font-size:9px">—</span></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin:10px 14px 0">
  <button id="sub-btn" onclick="toggleInv()" disabled style="flex:1;margin:0">▲ Substitute</button>
  <button id="reset-wall-btn" onclick="resetWall()" disabled title="Reset this wall to original" style="font-family:var(--font);font-size:11px;padding:8px 10px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;border-radius:2px;transition:all .15s;flex-shrink:0" onmouseover="if(!this.disabled)this.style.color='var(--danger)';if(!this.disabled)this.style.borderColor='rgba(240,96,80,.4)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border2)'">↺</button>
</div>
<div style="height:10px"></div>
    </div>

    <!-- 3D VIEWPORT -->
    <div id="viewport">
      <canvas id="three-canvas"></canvas>

      <div id="hint">scroll to zoom &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; right-drag to pan</div>

      <!-- North indicator + top view button -->
      <div style="position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:8px">
        <!-- North compass -->
        <div id="compass" style="width:36px;height:36px;position:relative;cursor:pointer;opacity:.7" title="Click to reset to top view" onclick="resetToNorth()">
          <svg viewBox="0 0 36 36" width="36" height="36">
            <circle cx="18" cy="18" r="17" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <!-- N needle (points north = -Z in our scene) -->
            <g id="compass-needle">
              <polygon points="18,4 21,18 18,16 15,18" fill="#c8f060"/>
              <polygon points="18,32 21,18 18,20 15,18" fill="rgba(255,255,255,0.25)"/>
            </g>
            <text x="18" y="3" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.5)" font-family="SpotMono,monospace" dominant-baseline="auto" dy="-1">N</text>
          </svg>
        </div>
        <!-- Top view button -->
        <button onclick="resetToNorth()" title="Top view" style="width:36px;height:22px;font-family:'SpotMono',monospace;font-size:8px;letter-spacing:.04em;text-transform:uppercase;border:1px solid rgba(255,255,255,.15);background:rgba(14,14,12,.8);color:rgba(255,255,255,.4);cursor:pointer;border-radius:2px;transition:all .15s" onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='rgba(255,255,255,.4)';this.style.borderColor='rgba(255,255,255,.15)'">top</button>
      </div>
    </div>

    <!-- RIGHT INVENTORY -->
    <div id="right">
      <div id="rhead">
        <div class="rh-tag">Inventory</div>
        <div class="rh-sub" id="rh-sub">Select a wall first</div>
      </div>
      <div id="inv-list"></div>
    </div>
  </div>

  <div id="status">
    <div class="st"><div class="dot" style="background:var(--ok)"></div><span id="st-ok">—</span></div>
    <div class="st"><div class="dot" style="background:var(--warn)"></div><span id="st-warn">—</span></div>
    <div class="st"><div class="dot" style="background:var(--danger)"></div><span id="st-crit">—</span></div>
    <div class="spacer"></div>
    <div class="st" id="st-extra"></div>
  </div>
</div>


<div id="tip"></div>

// ─── SUBSTITUTION MATRIX ──────────────────────────────────────────
// checkSubstitute(wallGrade, invGrade, use) → {ok:bool, reason:str}
function checkSubstitute(wallGrade, invGrade, use) {
  const g = wallGrade.toUpperCase();
  const ig = invGrade.toUpperCase();
  const rules = {
    "V1": { ok: ["V1","V2","E1","E2"],
            reason_ok: "any e-grade is an upgrade (machine-rated = more reliable)",
            reason_no: "V1 walls need V1, V2, E1, or E2 — other grades don't maintain compression" },
    "V2": { ok: ["V2","V1","E1","E2","E3","E4","E5"],
            reason_ok: "e-grades always acceptable as substitution for V-grade",
            reason_no: "V2 walls accept any e-grade or V1/V2 — this grade doesn't qualify" },
    "V3": { ok: ["V3","E4"],
            reason_ok: "same density requirement as E4 base walls",
            reason_no: "V3 (wall base) needs V3 or E4 only — unique density requirement" },
    "E1": { ok: ["E1","E2","E4"],
            reason_ok: "maintains or improves compression capacity",
            reason_no: "E1 walls need E1, E2, or E4 to maintain stiffness" },
    "E2": { ok: ["E2","E4"],
            reason_ok: "E4 adds compression capacity",
            reason_no: "E2 walls only accept E2 or E4 — E1 is less stiff for this application" },
    "E3": { ok: ["E3","E1","E2","E4"],
            reason_ok: "all maintain or improve structural performance",
            reason_no: "E3 walls need E3, E1, E2, or E4" },
    "E4": { ok: ["E4"],
            reason_ok: "unique density advantage — exact match required",
            reason_no: "E4 (wall base) has no true substitute — unique density advantage" },
    "E5": { ok: ["E5","E1","E3"],
            reason_ok: "E1 or E3 are natural upgrades for E5",
            reason_no: "E5 accepts only E5, E1, or E3 as substitutes" },
  };
  const rule = rules[g];
  if (!rule) return { ok: false, reason: "Unknown grade — cannot verify substitution" };
  const isOk = rule.ok.includes(ig);
  return { ok: isOk, reason: isOk ? rule.reason_ok : rule.reason_no };
}

// Position-based moisture rate (how fast moisture accumulates per year at this distance)
function moistureRate(distToCenter){
  const dn=(distToCenter-DIST_MIN)/(DIST_MAX-DIST_MIN);
  return (dn*0.55+0.15)/60; // spread over 60yr lifespan
}

function getMoist(e){
  const swapYear = e.swap_year !== undefined ? e.swap_year : 0;
  const carriedMoist = e.carried_moisture !== undefined ? e.carried_moisture : 0;
  const yearsInPosition = Math.max(yearOff - swapYear, 0);
  const rate = moistureRate(e.distance_to_building_center);
  return Math.min(carriedMoist + rate * yearsInPosition, 1);
}

function getLifeLeft(e){
  const swapYear = e.swap_year !== undefined ? e.swap_year : (e.install_year - BASE);
  const remainingAtSwap = e.remaining_at_swap !== undefined ? e.remaining_at_swap : e.estimated_years_of_life - (e.install_year - BASE);
  const yearsInPosition = Math.max(yearOff - swapYear, 0);
  return Math.max(remainingAtSwap - yearsInPosition, 0);
}

function getLifeFrac(e){
  return getLifeLeft(e) / e.estimated_years_of_life;
}

// Inventory element getters — frozen at their stored values
function getInvMoist(inv){
  return inv.frozen_moisture !== undefined ? inv.frozen_moisture : 0.1;
}
function getInvLifeLeft(inv){
  return inv.frozen_life !== undefined ? inv.frozen_life : Math.max(inv.estimated_years_of_life-(inv.install_year-BASE),0);
}
function getInvLifeFrac(inv){
  return getInvLifeLeft(inv)/inv.estimated_years_of_life;
}
function lifeHex(f){let r,g,b;if(f>0.5){const t=(f-.5)*2;r=Math.round(240*(1-t)+96*t);g=Math.round(176*(1-t)+208*t);b=Math.round(64*(1-t)+144*t);}else{const t=f*2;r=240;g=Math.round(96*(1-t)+160*t);b=64;}return(r<<16)|(g<<8)|b;}
function moistHex(m){const r=Math.round(20+m*80),g=Math.round(80+m*160),b=Math.round(80+m*160);return(r<<16)|(g<<8)|b;}
function elemColor(e){if(modeLife&&!modeMoist)return lifeHex(getLifeFrac(e));if(modeMoist&&!modeLife)return moistHex(getMoist(e));const lh=lifeHex(getLifeFrac(e)),mh=moistHex(getMoist(e));return(Math.round(((lh>>16)+(mh>>16))/2)<<16)|(Math.round((((lh>>8)&0xff)+((mh>>8)&0xff))/2)<<8)|Math.round(((lh&0xff)+(mh&0xff))/2);}

let isOrbit=false,isPan=false,lastX=0,lastY=0;
let theta=0.3,phi=Math.PI/2-0.42,radius=62;
const target=new THREE.Vector3(0,0,0);
function updateCam(){
  camera.position.x=target.x+radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y=target.y+radius*Math.cos(phi);
  camera.position.z=target.z+radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(target);
  updateCompass();
}
function updateCompass(){
  const needle=document.getElementById('compass-needle');
  if(!needle)return;
  // theta=0 means camera looks from +Z toward origin (south)
  // rotate needle so N always points toward -Z (north in scene)
  const deg = (theta * 180/Math.PI) % 360;
  needle.setAttribute('transform',`rotate(${deg},18,18)`);
}
function resetToNorth(){
  // Animate to top-down north view
  const targetTheta=0, targetPhi=0.08, targetRadius=50;
  const steps=30;
  let i=0;
  const dT=(targetTheta-theta)/steps, dP=(targetPhi-phi)/steps, dR=(targetRadius-radius)/steps;
  function step(){
    if(i++>=steps){theta=targetTheta;phi=targetPhi;radius=targetRadius;updateCam();return;}
    theta+=dT;phi+=dP;radius+=dR;updateCam();requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
updateCam();

  updateCam();
});

  document.getElementById('b-moist').style.width=(m*100).toFixed(1)+'%';
  document.getElementById('d-grade').textContent=e.clt_grade;
  document.getElementById('d-species').textContent=e.tree_species;
  document.getElementById('d-install').textContent=e.install_year;
  document.getElementById('d-life').textContent=e.estimated_years_of_life.toFixed(1)+' yr';
  document.getElementById('d-zone').textContent=e.zone_id;
  document.getElementById('d-dist').textContent=e.distance_to_building_center.toFixed(2)+' m';
  document.getElementById('d-risk').textContent=e.design_risk_condition;
}
function toggleMode(m){
  if(m==='life')modeLife=!modeLife;else modeMoist=!modeMoist;
  document.getElementById('btn-life').className='mbtn'+(modeLife?' on-life':'');
  document.getElementById('btn-moist').className='mbtn'+(modeMoist?' on-moist':'');
  updateColors();
}
function toggleInv(){
  invOpen=!invOpen;
  document.getElementById('right').classList.toggle('open',invOpen);
  document.getElementById('sub-btn').classList.toggle('on',invOpen);
  if(invOpen)renderInv();
}
function renderInv(){
  const wall = selId ? els.find(e=>e.element_id===selId) : null;
  const sub = document.getElementById('rh-sub');
  sub.textContent = wall ? `Substitutes for ${wall.element_id} (${wall.clt_grade})` : 'Select a wall first';

  document.getElementById('inv-list').innerHTML = INVENTORY.map(inv=>{
    const isSwappedOut = inv.swapped_out === true;
    const check = wall && !isSwappedOut ? checkSubstitute(wall.clt_grade, inv.clt_grade, 'wall') : {ok:false, reason:'This element is back from the building — re-check grade before reinstalling'};
    const lifeYrs = getInvLifeLeft(inv);
    const lifeFr = getInvLifeFrac(inv);
    const lc = lifeFr>0.5?'#60d090':lifeFr>0.2?'#f0b040':'#f06050';
    const icon = GRADE_ICONS[inv.clt_grade] || '◻';
    const compatClass = wall ? (check.ok ? 'compatible' : 'incompatible') : '';
    const badge = wall ? (check.ok
      ? `<span class="compat-badge ok">✓ OK</span>`
      : `<span class="compat-badge no">✗ No</span>`) : '';
    const conditionLabel = isSwappedOut ? 'swapped out' : inv.condition;
    const conditionClass = isSwappedOut ? 'swapped' : inv.condition;
    const reasonHtml = wall
      ? `<div class="compat-reason ${check.ok?'ok-reason':'no-reason'}">${check.reason}</div>`
      : '';
    const clickHandler = wall && check.ok
      ? `onclick="doSwap('${selId}','${inv.inv_id}')"`
      : '';

    return `<div class="icard ${compatClass}" ${clickHandler} style="${isSwappedOut?'border-color:rgba(96,200,240,0.2);background:rgba(96,200,240,0.04)':''}">
      ${badge}
      <div class="icard-top">
        <div class="icard-icon ${conditionClass}" style="${isSwappedOut?'background:rgba(96,200,240,.12);color:#60c8f0;border-color:rgba(96,200,240,.3)':''}">
          <span style="font-size:16px">${icon}</span>
        </div>
        <div class="icard-info">
          <div class="icard-id">${inv.inv_id}${isSwappedOut?' <span style="font-size:8px;color:#60c8f0">↩ returned</span>':''}</div>
          <div class="icard-grade">${inv.clt_grade} · ${conditionLabel}</div>
          <div class="icard-species">${inv.tree_species}</div>
        </div>
      </div>
      <div class="icard-bars">
        <div class="mb"><div class="mb-fill" style="width:${(lifeFr*100).toFixed(0)}%;background:${isSwappedOut?'#60c8f0':lc}"></div></div>
      </div>
      <div class="icard-foot">
        <span style="color:${isSwappedOut?'#60c8f0':lc}">${lifeYrs.toFixed(1)} yr left</span>
        <span style="color:var(--text3);font-size:8px">${inv.provenance}</span>
      </div>
      ${reasonHtml}
    </div>`;
  }).join('');
}

// ─── MODAL ────────────────────────────────────────────────────────


function doSwap(wallId, invId) {
  const wallEl = els.find(e=>e.element_id===wallId);
  const invIdx = INVENTORY.findIndex(i=>i.inv_id===invId);
  const invEl = INVENTORY[invIdx];

  // Snapshot outgoing wall's current state
  const wallLifeNow = getLifeLeft(wallEl);
  const wallMoistNow = getMoist(wallEl);

  // Build outgoing element (wall → inventory) frozen
  const outgoing = {
    inv_id: wallEl.element_id,
    clt_grade: wallEl.clt_grade,
    tree_species: wallEl.tree_species,
    dimensions: {...wallEl.dimensions},
    estimated_years_of_life: wallEl.estimated_years_of_life,
    install_year: wallEl.install_year,
    condition: 'swapped-out',
    provenance: `From wall ${wallEl.element_id} · swapped ${BASE+yearOff}`,
    swapped_out: true,
    frozen_life: wallLifeNow,
    frozen_moisture: wallMoistNow,
  };

  // Apply incoming element to wall position
  wallEl.clt_grade = invEl.clt_grade;
  wallEl.tree_species = invEl.tree_species;
  wallEl.estimated_years_of_life = invEl.estimated_years_of_life;
  wallEl.install_year = invEl.install_year;
  wallEl.design_risk_condition = `Substituted from ${invId}`;
  wallEl.substituted = true;
  wallEl.substituted_from = invId;
  wallEl._origInvIdx = invIdx;
  wallEl.swap_year = yearOff;
  wallEl.remaining_at_swap = getInvLifeLeft(invEl);
  wallEl.carried_moisture = getInvMoist(invEl);

  // Replace inventory slot with outgoing element
  INVENTORY[invIdx] = outgoing;

  updateColors();
  updatePanel(wallEl);
  renderInv();
  updateStatus();
  const cur = document.getElementById('st-extra').textContent;
  const n = parseInt(cur)||0;
  document.getElementById('st-extra').textContent = (n+1) + ' swap' + (n+1>1?'s':'');
}


function resetWall(){
  if(!selId) return;
  const wall=els.find(e=>e.element_id===selId);
  if(!wall||!wall.substituted) return;

  // Find which inventory slot holds the swapped-out original
  const invIdx=INVENTORY.findIndex(i=>i.inv_id===selId);

  // Restore wall from RAW
  const raw=RAW.find(r=>r.element_id===selId);
  wall.clt_grade=raw.clt_grade;
  wall.tree_species=raw.tree_species;
  wall.estimated_years_of_life=raw.estimated_years_of_life;
  wall.install_year=raw.install_year;
  wall.design_risk_condition=raw.design_risk_condition;
  wall.substituted=false;
  wall.substituted_from=null;
  wall.swap_year=raw.install_year-BASE;
  wall.remaining_at_swap=raw.estimated_years_of_life;
  wall.carried_moisture=0.12;

  // If the swapped-out element is still in inventory, restore the original inv item there
  // Restore the inventory slot that was used in the swap
  const origInvIdx = wall._origInvIdx;
  if(origInvIdx !== undefined && origInvIdx >= 0){
    INVENTORY[origInvIdx] = {...ORIG_INVENTORY[origInvIdx]};
  } else if(invIdx>=0){
    INVENTORY[invIdx] = {...ORIG_INVENTORY[invIdx]};
  }

  updatePanel(wall);
  updateColors();
  if(invOpen) renderInv();
  updateStatus();
  document.getElementById('reset-wall-btn').disabled=true;
  document.getElementById('reset-wall-btn').style.opacity='0.3';
}

function resetAll(){
  // Restore all wall elements from RAW
  RAW.forEach(raw=>{
    const e=els.find(el=>el.element_id===raw.element_id);
    if(!e)return;
    e.clt_grade=raw.clt_grade;
    e.tree_species=raw.tree_species;
    e.estimated_years_of_life=raw.estimated_years_of_life;
    e.install_year=raw.install_year;
    e.design_risk_condition=raw.design_risk_condition;
    e.substituted=false;
    e.substituted_from=null;
    e.swap_year=raw.install_year-BASE;
    e.remaining_at_swap=raw.estimated_years_of_life;
    e.carried_moisture=0.12;
  });
  // Restore inventory from original
  ORIG_INVENTORY.forEach((orig,i)=>{ INVENTORY[i]={...orig}; });
  // Reset year
  yearOff=0;
  document.getElementById('yr-slider').value=0;
  document.getElementById('yr-disp').textContent=BASE;
  // Reset selection
  selId=null;
  document.getElementById('lh-id').textContent='—';
  document.getElementById('lh-sub').textContent='';
  document.getElementById('empty-msg').style.display='block';
  document.getElementById('detail').style.display='none';
  document.getElementById('sub-btn').disabled=true;
  document.getElementById('sub-btn').classList.remove('on');
  // Close inventory
  invOpen=false;
  document.getElementById('right').classList.remove('open');
  // Reset status
  document.getElementById('st-extra').textContent='';
  buildWalls();
  updateStatus();
}

function updateStatus(){
  let ok=0,warn=0,crit=0;
  els.forEach(e=>{const f=getLifeFrac(e);if(f>0.5)ok++;else if(f>0.15)warn++;else crit++;});
  document.getElementById('st-ok').textContent=ok+' ok';
  document.getElementById('st-warn').textContent=warn+' warning';
  document.getElementById('st-crit').textContent=crit+' critical';
}
document.getElementById('yr-slider').addEventListener('input',function(){
  yearOff=+this.value;
  document.getElementById('yr-disp').textContent=BASE+yearOff;
  updateColors();
  if(selId){const e=els.find(el=>el.element_id===selId);if(e)updatePanel(e);}
  if(invOpen)renderInv();
  updateStatus();
});
updateStatus();
</script>
